    <script>
        window.LOCAL_ASSETS = {
            model: './assets/models/room.glb',
            envmap: './assets/models/autumn_field_puresky_1k.hdr',
            textures: './assets/textures/',
            videos: './assets/videos/',
            images: './assets/images/'
        };

        (() => {
            const localMap = {
                'https://mbilalkhan.com/bilal/Assets/Model/room.glb': './assets/models/room.glb',
                'https://mbilalkhan.com/bilal/Assets/Envmap/autumn_field_puresky_1k.hdr': './assets/models/autumn_field_puresky_1k.hdr',
                'https://techredux.co/bilal/Assets/icons/play.png': './icon.png',
                'https://techredux.co/bilal/Assets/icons/close.png': './icon.png'
            };

            const rewriteAssetUrl = (url) => {
                if (typeof url !== 'string') return url;
                if (localMap[url]) return localMap[url];
                if (url.includes('/bilal/Assets/')) {
                    const tail = url.split('/bilal/Assets/')[1];
                    if (tail.startsWith('Model/'))    return './assets/models/'   + tail.replace(/^Model\//, '');
                    if (tail.startsWith('Envmap/'))   return './assets/models/'   + tail.replace(/^Envmap\//, '');
                    if (tail.startsWith('Textures/')) return './assets/textures/' + tail.replace(/^Textures\//, '');
                    if (tail.startsWith('Videos/'))   return './assets/videos/'   + tail.replace(/^Videos\//, '');
                    if (tail.startsWith('Images/'))   return './assets/images/'   + tail.replace(/^Images\//, '');
                }
                if (url === '/draco/' || url.startsWith('/draco/')) {
                    return url.replace(/^\/draco\//, './draco/');
                }
                return url;
            };

            const nativeFetch = window.fetch;
            if (nativeFetch) {
                window.fetch = function (input, init) {
                    const resource = typeof input === 'string' ? input : (input && input.url) ? input.url : input;
                    const rewritten = rewriteAssetUrl(resource);
                    if (typeof input !== 'string' && input && input.url) {
                        input = new Request(rewritten, input);
                        return nativeFetch.call(this, input, init);
                    }
                    return nativeFetch.call(this, rewritten, init);
                };
            }

            const nativeSetAttribute = Element.prototype.setAttribute;
            Element.prototype.setAttribute = function (name, value) {
                if ((name === 'src' || name === 'href' || name === 'poster') && typeof value === 'string') {
                    value = rewriteAssetUrl(value);
                }
                return nativeSetAttribute.call(this, name, value);
            };

            ['HTMLVideoElement', 'HTMLImageElement', 'HTMLSourceElement', 'HTMLAudioElement'].forEach((ctorName) => {
                const ctor = window[ctorName];
                if (!ctor) return;
                const proto = ctor.prototype;
                const desc = Object.getOwnPropertyDescriptor(proto, 'src');
                if (!desc || !desc.set) return;
                Object.defineProperty(proto, 'src', {
                    get: desc.get,
                    set(value) {
                        return desc.set.call(this, rewriteAssetUrl(value));
                    },
                    configurable: true,
                    enumerable: desc.enumerable
                });
            });

            const nativeXhrOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url, ...rest) {
                return nativeXhrOpen.call(this, method, rewriteAssetUrl(url), ...rest);
            };
        })();

    <!-- ===== Styled WebGL wall-cover overlay (added by Claude) ===== -->
    <script>
    (function () {
        console.log('[Overlay] Loading editorial plaques...');

        const REGIONS = [
            {
                name: 'Artist Bio',
                label: 'My name is',
                title: 'Daniel Dube',
                body: 'A recent Business Management professional — and I am just getting started.',
                scaleX: 1.0,
                scaleY: 1.0,
                corners: {
                    topLeft:     [-2.0764999389648438, 2.4467147532278535, 1.5371990433244984],
                    topRight:    [-2.0764999389648433, 2.4471037657915606, -0.015578277016541341],
                    bottomRight: [-2.0764999389648438, 2.0871807728756124, -0.025314288630790827],
                    bottomLeft:  [-2.0764999389648438, 2.0872256355262713, 1.5503160625422368]
                }
            },
            {
                name: 'Location',
                label: 'Based in',
                title: 'Mmabatho, South Africa',
                body: 'I build things, work on ideas, and find opportunities others might overlook.',
                scaleX: 1.0,
                scaleY: 1.0,
                corners: {
                    topLeft:     [-1.090829545168689,  2.6433311830811066, -2.410000085830688],
                    topRight:    [ 1.2562669858595357, 2.6494711777211504, -2.4100000858306885],
                    bottomRight: [ 1.2850871501858911, 2.2028274886030053, -2.4100000858306894],
                    bottomLeft:  [-1.1181524349334293, 2.202971543542314,  -2.4100000858306885]
                }
            },
            {
                name: 'My Work',
                label: 'Selected projects',
                title: 'My Work',
                body: '',
                scaleX: 1.05,
                scaleY: 1.0,
                corners: {
                    topLeft:     [ 0.5666273472527969, 2.8879853648466443, 2.4100000858306885],
                    topRight:    [-0.46535640490673,   2.8879853648466443, 2.4100000858306885],
                    bottomRight: [-0.46535640490673,   2.62410235909414,  2.4100000858306885],
                    bottomLeft:  [ 0.5666273472527969, 2.62410235909414,  2.4100000858306885]
                }
            }
        ];

        function scaleCorners(corners, sx, sy) {
            if (sx === 1 && sy === 1) return corners;
            const keys = ['topLeft','topRight','bottomRight','bottomLeft'];
            const c = [0,0,0];
            keys.forEach(k => { c[0]+=corners[k][0]; c[1]+=corners[k][1]; c[2]+=corners[k][2]; });
            c[0]/=4; c[1]/=4; c[2]/=4;
            const topR = corners.topRight, botL = corners.bottomLeft;
            const ax = [topR[0]-corners.topLeft[0], topR[1]-corners.topLeft[1], topR[2]-corners.topLeft[2]];
            const ay = [botL[0]-corners.topLeft[0], botL[1]-corners.topLeft[1], botL[2]-corners.topLeft[2]];
            const out = {};
            keys.forEach(k => {
                const p = corners[k];
                const v = [p[0]-c[0], p[1]-c[1], p[2]-c[2]];
                const lx = (v[0]*ax[0] + v[1]*ax[1] + v[2]*ax[2]) / (ax[0]*ax[0] + ax[1]*ax[1] + ax[2]*ax[2]);
                const ly = (v[0]*ay[0] + v[1]*ay[1] + v[2]*ay[2]) / (ay[0]*ay[0] + ay[1]*ay[1] + ay[2]*ay[2]);
                const px = lx * sx, py = ly * sy;
                out[k] = [
                    c[0] + px * ax[0] + py * ay[0],
                    c[1] + px * ax[1] + py * ay[1],
                    c[2] + px * ax[2] + py * ay[2]
                ];
            });
            return out;
        }
        REGIONS.forEach(r => { r.corners = scaleCorners(r.corners, r.scaleX, r.scaleY); });

        let gl = null;
        const nativeGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (type) {
            const ctx = nativeGetContext.apply(this, arguments);
            if (ctx && (type === 'webgl2' || type === 'webgl' || type === 'experimental-webgl')) {
                gl = ctx;
                let attempts = 0;
                const tryInit = () => {
                    attempts++;
                    if (initOverlay()) { console.log('[Overlay] Ready.'); return; }
                    if (attempts < 30) setTimeout(tryInit, 100);
                    else console.warn('[Overlay] Gave up.');
                };
                setTimeout(tryInit, 100);
            }
            return ctx;
        };

        const matrixState = { projectionMatrix: null, viewMatrix: null };
        const locationNames = new WeakMap();
        let overlayScheduled = false;
        let isOurDraw = false;

        function patchGL(proto) {
            if (!proto || proto.__overlayPatched) return;
            proto.__overlayPatched = true;

            const nativeGetUniformLocation = proto.getUniformLocation;
            proto.getUniformLocation = function (program, name) {
                const loc = nativeGetUniformLocation.call(this, program, name);
                if (loc) locationNames.set(loc, name);
                return loc;
            };

            const nativeUniformMatrix4fv = proto.uniformMatrix4fv;
            proto.uniformMatrix4fv = function (location, transpose, value) {
                const name = location && locationNames.get(location);
                if (name === 'projectionMatrix') matrixState.projectionMatrix = Float32Array.from(value);
                else if (name === 'viewMatrix') matrixState.viewMatrix = Float32Array.from(value);
                return nativeUniformMatrix4fv.apply(this, arguments);
            };

            const DRAW_FNS = [
                'drawArrays', 'drawElements',
                'drawArraysInstanced', 'drawElementsInstanced',
                'drawRangeElements',
                'multiDrawArraysWEBGL', 'multiDrawElementsWEBGL'
            ];
            DRAW_FNS.forEach(fn => {
                if (typeof proto[fn] !== 'function') return;
                const native = proto[fn];
                proto[fn] = function () {
                    const result = native.apply(this, arguments);
                    if (!isOurDraw && this === gl) scheduleOverlayDraw();
                    return result;
                };
            });
        }
        if (window.WebGL2RenderingContext) patchGL(WebGL2RenderingContext.prototype);
        if (window.WebGLRenderingContext) patchGL(WebGLRenderingContext.prototype);

        function scheduleOverlayDraw() {
            if (overlayScheduled) return;
            overlayScheduled = true;
            queueMicrotask(() => {
                overlayScheduled = false;
                try { drawOverlay(); } catch (e) { console.warn('[Overlay] draw error:', e); }
            });
        }

        const VS_SOURCE = `#version 300 es
        layout(location = 0) in vec3 aPosition;
        layout(location = 1) in vec2 aUv;
        uniform mat4 projectionMatrix;
        uniform mat4 viewMatrix;
        out vec2 vUv;
        void main() {
            vUv = aUv;
            gl_Position = projectionMatrix * viewMatrix * vec4(aPosition, 1.0);
        }`;

        const FS_SOURCE = `#version 300 es
        precision mediump float;
        in vec2 vUv;
        uniform sampler2D uTexture;
        out vec4 fragColor;
        void main() {
            fragColor = texture(uTexture, vUv);
        }`;

        let program = null;
        let vao = null;
        let vbo = null;
        let uProjection = null;
        let uView = null;
        let uTextureLoc = null;

        const PX_PER_UNIT = 400;

        const C = {
            paper1: '#fbf6ec',
            paper2: '#efe4f4',
            ink:    '#251436',
            muted:  '#6a5379',
            plum:   '#4d2880',
            accent: '#7c3aed',
            copper: '#b87333',
            glowP:  'rgba(124, 58, 237, 0.45)',
            glowC:  'rgba(184, 115, 51, 0.35)'
        };

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function dist(a, b) {
            const dx = a[0]-b[0], dy = a[1]-b[1], dz = a[2]-b[2];
            return Math.sqrt(dx*dx + dy*dy + dz*dz);
        }

        function wrapText(ctx, text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let line = '';
            for (const w of words) {
                const test = line ? line + ' ' + w : w;
                if (ctx.measureText(test).width > maxWidth && line) {
                    lines.push(line);
                    line = w;
                } else {
                    line = test;
                }
            }
            if (line) lines.push(line);
            return lines;
        }

        function drawPlaque(ctx, cw, ch, region) {
            const pad = Math.round(Math.min(cw, ch) * 0.05);
            const radius = Math.round(ch * 0.14);

            ctx.save();
            ctx.shadowColor = C.glowP;
            ctx.shadowBlur = Math.round(ch * 0.30);
            roundRect(ctx, pad, pad, cw - pad*2, ch - pad*2, radius);
            ctx.fillStyle = 'rgba(255,255,255,0.01)';
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.shadowColor = C.glowC;
            ctx.shadowBlur = Math.round(ch * 0.18);
            roundRect(ctx, pad, pad, cw - pad*2, ch - pad*2, radius);
            ctx.fillStyle = 'rgba(255,255,255,0.01)';
            ctx.fill();
            ctx.restore();

            const grad = ctx.createLinearGradient(pad, pad, cw - pad, ch - pad);
            grad.addColorStop(0, C.paper1);
            grad.addColorStop(1, C.paper2);
            roundRect(ctx, pad, pad, cw - pad*2, ch - pad*2, radius);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.strokeStyle = C.ink;
            ctx.lineWidth = Math.max(2, Math.round(ch * 0.010));
            roundRect(ctx, pad, pad, cw - pad*2, ch - pad*2, radius);
            ctx.stroke();

            const inset = pad + Math.round(Math.min(cw, ch) * 0.035);
            const innerR = Math.max(4, radius - Math.round(Math.min(cw, ch) * 0.03));
            ctx.strokeStyle = C.copper;
            ctx.lineWidth = Math.max(1, Math.round(ch * 0.005));
            roundRect(ctx, inset, inset, cw - inset*2, ch - inset*2, innerR);
            ctx.stroke();

            const dotR = Math.max(2, Math.round(ch * 0.014));
            ctx.fillStyle = C.copper;
            [[inset, inset], [cw - inset, inset], [inset, ch - inset], [cw - inset, ch - inset]]
                .forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.arc(x, y, dotR, 0, Math.PI * 2);
                    ctx.fill();
                });

            const innerX = inset + Math.round(Math.min(cw, ch) * 0.06);
            const innerW = cw - innerX * 2;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const hasBody = !!region.body;
            const isHeading = !hasBody;

            const labelSize = Math.max(9, Math.round(ch * 0.075));
            ctx.font = `700 ${labelSize}px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif`;
            ctx.fillStyle = C.copper;
            const labelY = isHeading ? ch * 0.26 : ch * 0.20;
            const labelText = region.label.toUpperCase();
            const labelSpaced = labelText.split('').join(' ');
            ctx.fillText(labelSpaced, cw / 2, labelY);

            const dividerY = isHeading ? ch * 0.42 : ch * 0.36;
            const divW = Math.min(cw * 0.18, ch * 0.6);
            ctx.strokeStyle = C.plum;
            ctx.lineWidth = Math.max(1.5, Math.round(ch * 0.007));
            ctx.beginPath();
            ctx.moveTo(cw / 2 - divW, dividerY);
            ctx.lineTo(cw / 2 + divW, dividerY);
            ctx.stroke();
            ctx.fillStyle = C.plum;
            ctx.beginPath();
            ctx.arc(cw / 2, dividerY, Math.max(2, Math.round(ch * 0.014)), 0, Math.PI * 2);
            ctx.fill();

            const titleBase = isHeading ? 0.34 : 0.24;
            let titleSize = Math.round(ch * titleBase);
            const titleFont = (s) => `500 ${s}px Georgia, "Times New Roman", serif`;
            ctx.font = titleFont(titleSize);
            while (ctx.measureText(region.title).width > innerW * 0.96 && titleSize > 12) {
                titleSize -= 1;
                ctx.font = titleFont(titleSize);
            }
            ctx.fillStyle = C.ink;
            const titleY = isHeading ? ch * 0.60 : ch * 0.52;
            ctx.fillText(region.title, cw / 2, titleY);

            if (hasBody) {
                const bodySize = Math.max(9, Math.round(ch * 0.075));
                ctx.font = `400 ${bodySize}px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif`;
                ctx.fillStyle = C.muted;
                const lines = wrapText(ctx, region.body, innerW * 0.94);
                const lineH = bodySize * 1.45;
                const bodyBlockTop = ch * 0.70;
                const bodyBlockH = lines.length * lineH;
                const startY = bodyBlockTop + (ch * 0.90 - bodyBlockTop - bodyBlockH) / 2 + lineH / 2;
                lines.forEach((line, i) => {
                    ctx.fillText(line, cw / 2, startY + i * lineH);
                });
            }
        }

        function createCardCanvas(region) {
            const c = region.corners;
            const wWorld = dist(c.topLeft, c.topRight);
            const hWorld = dist(c.topLeft, c.bottomLeft);

            const cw = Math.max(400, Math.round(wWorld * PX_PER_UNIT));
            const ch = Math.max(160, Math.round(hWorld * PX_PER_UNIT));

            const canvas = document.createElement('canvas');
            canvas.width = cw;
            canvas.height = ch;
            const ctx = canvas.getContext('2d');
            ctx.textRendering = 'geometricPrecision';

            drawPlaque(ctx, cw, ch, region);
            return canvas;
        }

        function createCardTexture(region) {
            const canvas = createCardCanvas(region);
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.generateMipmap(gl.TEXTURE_2D);
            gl.bindTexture(gl.TEXTURE_2D, null);
            return tex;
        }

        function initOverlay() {
            if (!gl || program) return !!program;
            if (gl.isContextLost && gl.isContextLost()) return false;
            try {
                const vs = gl.createShader(gl.VERTEX_SHADER);
                gl.shaderSource(vs, VS_SOURCE); gl.compileShader(vs);
                if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
                    console.warn('[Overlay] VS:', gl.getShaderInfoLog(vs)); return false;
                }
                const fs = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(fs, FS_SOURCE); gl.compileShader(fs);
                if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
                    console.warn('[Overlay] FS:', gl.getShaderInfoLog(fs)); return false;
                }
                program = gl.createProgram();
                gl.attachShader(program, vs); gl.attachShader(program, fs);
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    console.warn('[Overlay] Link:', gl.getProgramInfoLog(program));
                    program = null; return false;
                }
                uProjection = gl.getUniformLocation(program, 'projectionMatrix');
                uView = gl.getUniformLocation(program, 'viewMatrix');
                uTextureLoc = gl.getUniformLocation(program, 'uTexture');

                vao = gl.createVertexArray();
                vbo = gl.createBuffer();
                gl.bindVertexArray(vao);
                gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
                gl.enableVertexAttribArray(0);
                gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
                gl.enableVertexAttribArray(1);
                gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);
                gl.bindVertexArray(null);

                REGIONS.forEach(r => { r.texture = createCardTexture(r); });
                return true;
            } catch (e) {
                console.warn('[Overlay] init exception:', e); return false;
            }
        }

        const TRI_ORDER = ['topLeft', 'bottomLeft', 'bottomRight',
                           'topLeft', 'bottomRight', 'topRight'];
        const UV_TABLE = {
            topLeft:     [0, 0],
            topRight:    [1, 0],
            bottomLeft:  [0, 1],
            bottomRight: [1, 1]
        };

        function drawOverlay() {
            if (!gl || !program) return;
            if (!matrixState.projectionMatrix || !matrixState.viewMatrix) return;
            if (gl.isContextLost && gl.isContextLost()) return;

            isOurDraw = true;

            let prevProgram, prevVAO, prevBlend, prevDepthTest, prevCullFace,
                prevBlendSrc, prevBlendDst, prevActiveTex, prevTex0;
            try {
                prevProgram   = gl.getParameter(gl.CURRENT_PROGRAM);
                prevVAO       = gl.getParameter(gl.VERTEX_ARRAY_BINDING);
                prevBlend     = gl.getParameter(gl.BLEND);
                prevDepthTest = gl.getParameter(gl.DEPTH_TEST);
                prevCullFace  = gl.getParameter(gl.CULL_FACE);
                prevBlendSrc  = gl.getParameter(gl.BLEND_SRC_RGB);
                prevBlendDst  = gl.getParameter(gl.BLEND_DST_RGB);
                prevActiveTex = gl.getParameter(gl.ACTIVE_TEXTURE);
                gl.activeTexture(gl.TEXTURE0);
                prevTex0      = gl.getParameter(gl.TEXTURE_BINDING_2D);
            } catch (e) { isOurDraw = false; return; }

            try {
                gl.useProgram(program);
                gl.bindVertexArray(vao);

                gl.uniformMatrix4fv(uProjection, false, matrixState.projectionMatrix);
                gl.uniformMatrix4fv(uView, false, matrixState.viewMatrix);
                gl.uniform1i(uTextureLoc, 0);

                gl.disable(gl.CULL_FACE);
                gl.disable(gl.DEPTH_TEST);
                gl.enable(gl.BLEND);
                gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

                for (let r = 0; r < REGIONS.length; r++) {
                    const region = REGIONS[r];
                    if (!region.texture) continue;

                    const verts = new Float32Array(30);
                    let i = 0;
                    for (let k = 0; k < 6; k++) {
                        const key = TRI_ORDER[k];
                        const c = region.corners[key];
                        const uv = UV_TABLE[key];
                        verts[i++] = c[0];
                        verts[i++] = c[1];
                        verts[i++] = c[2];
                        verts[i++] = uv[0];
                        verts[i++] = uv[1];
                    }
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, region.texture);
                    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
                    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STREAM_DRAW);
                    gl.drawArrays(gl.TRIANGLES, 0, 6);
                }

                gl.useProgram(prevProgram);
                gl.bindVertexArray(prevVAO);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, prevTex0);
                gl.activeTexture(prevActiveTex);
                if (prevBlend) gl.enable(gl.BLEND); else gl.disable(gl.BLEND);
                if (prevDepthTest) gl.enable(gl.DEPTH_TEST); else gl.disable(gl.DEPTH_TEST);
                if (prevCullFace) gl.enable(gl.CULL_FACE); else gl.disable(gl.CULL_FACE);
                if (prevBlend) gl.blendFunc(prevBlendSrc, prevBlendDst);
            } catch (e) {
                console.warn('[Overlay] draw failed:', e);
            } finally {
                isOurDraw = false;
            }
        }
